name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: unzip -q squirrelmod.zip
      - run: gradle build
        working-directory: squirrelmod
      - uses: actions/upload-artifact@v4
        with:
          name: squirrelmod-jar
          path: squirrelmod/build/libs/*.jar
